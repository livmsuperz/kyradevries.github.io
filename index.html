<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Achtergrond -->
    <div class="background"></div>

    <!-- Navigatiebalk -->
    <header class="navbar">

        <div class="logo">
            Welcome to my website
        </div>

        <div class="search-container">
            <input 
                type="search" 
                placeholder="Search..."
                aria-label="Search"
            >

            <button type="button" aria-label="Search">
                🔍
            </button>
        </div>

    </header>


    <!-- Hoofdcontent -->
    <main>

        <section class="intro-card">

            <h1>Introduction</h1>

            <p>
                Welcome to my website!
            </p>

            <p>
                Dit is mijn persoonlijke website. Hier kun je meer
                informatie vinden over mij, mijn projecten en mijn
                interesses.
            </p>

            <button class="learn-more">
                Learn More
            </button>

        </section>
        <link rel="stylesheet" href="style.css">

    </main>

</body>
</html>
